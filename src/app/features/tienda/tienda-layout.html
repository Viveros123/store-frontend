<mat-toolbar class="fs-toolbar">
  <a routerLink="/" class="fs-brand">
    <mat-icon>storefront</mat-icon>
    FashionStore
  </a>

  <nav class="fs-nav">
    <a routerLink="/" routerLinkActive="on" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
    <a routerLink="/catalogo" routerLinkActive="on">Catálogo</a>
  </nav>

  <span class="flex-1"></span>

  @if (usuario(); as u) {
    @if (esAdmin()) {
      <button mat-button routerLink="/admin" class="hide-xs">Administración</button>
    }
    @if (esProveedor()) {
      <button mat-button routerLink="/proveedor" class="hide-xs">Portal proveedor</button>
    }
    <button mat-button [matMenuTriggerFor]="cuenta" class="cuenta-btn">
      <mat-icon>account_circle</mat-icon>
      <span class="hide-xs">{{ u.nombre }}</span>
    </button>
    <mat-menu #cuenta="matMenu">
      <div class="menu-head">
        <strong>{{ u.nombre }} {{ u.apellido }}</strong>
        <small>{{ u.email }}</small>
        <small class="rol">{{ u.rol }}</small>
      </div>
      @if (esAdmin()) {
        <button mat-menu-item routerLink="/admin">
          <mat-icon>dashboard</mat-icon> Panel de administración
        </button>
      }
      @if (esProveedor()) {
        <button mat-menu-item routerLink="/proveedor">
          <mat-icon>dashboard</mat-icon> Portal proveedor
        </button>
      }
      <button mat-menu-item routerLink="/mi-cuenta">
        <mat-icon>person</mat-icon> Mi cuenta
      </button>
      <button mat-menu-item (click)="salir()">
        <mat-icon>logout</mat-icon> Cerrar sesión
      </button>
    </mat-menu>
  } @else {
    <button mat-button routerLink="/ingresar" class="hide-xs">Iniciar sesión</button>
    <button mat-flat-button class="btn-registro" routerLink="/registro">Crear cuenta</button>
  }
</mat-toolbar>

<router-outlet />
